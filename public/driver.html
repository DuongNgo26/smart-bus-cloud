<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn hình tài xế - Smart Bus</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        
        .container { max-width: 850px; margin: 0 auto; }
        
        .header { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .header h2 { margin: 0 0 10px 0; color: #38bdf8; }
        .status-box { font-size: 18px; font-weight: bold; color: #facc15; }
        .direction-box { margin-top: 8px; font-size: 15px; color: #94a3b8; }
        
        .stop-list { background: #1e293b; border-radius: 12px; padding: 15px; border: 1px solid #334155; }
        
        .stop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #334155;
            border-left: 6px solid #64748b;
        }
        
        /* Trạng thái trạm */
        .stop-item.current { border-left-color: #38bdf8; background: #1e3a8a; }
        .stop-item.has-request-len { border-left-color: #22c55e; background: #14532d; }
        .stop-item.has-request-xuong { border-left-color: #ef4444; background: #7f1d1d; }
        .stop-item.has-request-both { border-left-color: #eab308; background: #713f12; }
        
        /* Tên trạm không bị ngắt dòng */
        .stop-name {
            font-size: 16px;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        /* Badge giữ thẳng hàng ngang */
        .badges {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
        }
        
        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .badge-current { background: #38bdf8; color: #0f172a; }
        .badge-next { background: #a78bfa; color: #0f172a; }
        .badge-len { background: #22c55e; color: #fff; animation: pulse 1.5s infinite; }
        .badge-xuong { background: #ef4444; color: #fff; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .btn-next { width: 100%; padding: 16px; background: #2563eb; color: #fff; border: none; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        .btn-next:hover { background: #1d4ed8; }
        .btn-next:active { transform: scale(0.99); }
        .refresh-info { text-align: center; font-size: 13px; color: #94a3b8; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>🚌 BẢNG ĐIỀU KHIỂN TÀI XẾ</h2>
            <div class="status-box" id="currentStopTitle">Trạm hiện tại: Đang tải...</div>
            <div class="direction-box" id="directionInfo"></div>
            <button class="btn-next" id="btnNextStop" onclick="nextStop()">⏭️ CHUYỂN SANG TRẠM KẾ TIẾP</button>
        </div>

        <div class="stop-list" id="stopList">
            <div style="text-align: center; color: #94a3b8;">Đang tải danh sách trạm...</div>
        </div>

        <div class="refresh-info">🔄 Tự động cập nhật tín hiệu từ hành khách mỗi 3 giây</div>
    </div>

    <script>
        const ID_TRIP = 1;
        let state = null;               // { stops, currentSequence, huong }
        let pending = 0;                // số yêu cầu chuyển trạm đang chờ server
        let lastActionAt = 0;           // thời điểm bấm gần nhất
        let queue = Promise.resolve();  // xếp hàng để server nhận đúng thứ tự

        // Giống hệt logic trên server
        function tinhTramKeTiep(seq, huong, minSeq, maxSeq) {
            if (huong === 1) {
                if (seq >= maxSeq) return { seq: Math.max(maxSeq - 1, minSeq), huong: -1 };
                return { seq: seq + 1, huong: 1 };
            } else {
                if (seq <= minSeq) return { seq: Math.min(minSeq + 1, maxSeq), huong: 1 };
                return { seq: seq - 1, huong: -1 };
            }
        }

        function render() {
            if (!state) return;
            const { stops, currentSequence, huong } = state;
            const first = stops[0];
            const last = stops[stops.length - 1];
            const nextSequence = tinhTramKeTiep(currentSequence, huong, first.thuTu, last.thuTu).seq;

            const currentStop = stops.find(s => s.thuTu === currentSequence);
            if (currentStop) {
                document.getElementById('currentStopTitle').innerText =
                    `📍 Vị trí xe: ${currentStop.tenTram} (Trạm ${currentSequence}/${stops.length})`;
            }

            document.getElementById('directionInfo').innerText = huong === 1
                ? `➡️ Chiều đi: ${first.tenTram} → ${last.tenTram}`
                : `⬅️ Chiều về: ${last.tenTram} → ${first.tenTram}`;

            const container = document.getElementById('stopList');
            let html = '';

            stops.forEach(stop => {
                const isCurrent = stop.thuTu === currentSequence;
                const isNext = stop.thuTu === nextSequence && !isCurrent;

                let itemClass = 'stop-item';
                if (isCurrent) {
                    itemClass += ' current';
                } else if (stop.hasLen && stop.hasXuong) {
                    itemClass += ' has-request-both';
                } else if (stop.hasLen) {
                    itemClass += ' has-request-len';
                } else if (stop.hasXuong) {
                    itemClass += ' has-request-xuong';
                }

                let badgesHtml = '';
                if (isCurrent) badgesHtml += '<span class="badge badge-current">🚌 XE Ở ĐÂY</span>';
                if (isNext) badgesHtml += '<span class="badge badge-next">⏭️ TRẠM KẾ</span>';
                if (stop.hasLen) badgesHtml += '<span class="badge badge-len">🟢 CÓ KHÁCH LÊN</span>';
                if (stop.hasXuong) badgesHtml += '<span class="badge badge-xuong">🔴 CÓ KHÁCH XUỐNG</span>';

                html += `
                    <div class="${itemClass}">
                        <div class="stop-name">${stop.thuTu}. ${stop.tenTram}</div>
                        <div class="badges">${badgesHtml}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        async function fetchTripData() {
            const startedAt = Date.now();
            try {
                const res = await fetch(`/api/trip-info/${ID_TRIP}`);
                const rawData = await res.json();

                if (!Array.isArray(rawData) || rawData.length === 0) {
                    document.getElementById('stopList').innerHTML = '<div style="text-align:center;">Không có dữ liệu chuyến xe</div>';
                    return;
                }

                // Bỏ qua dữ liệu cũ nếu tài xế vừa bấm chuyển trạm
                if (pending > 0 || startedAt < lastActionAt) return;

                const stopsMap = new Map();
                rawData.forEach(item => {
                    if (!stopsMap.has(item.idStop)) {
                        stopsMap.set(item.idStop, {
                            idStop: item.idStop,
                            tenTram: item.tenTram,
                            thuTu: item.thuTu,
                            hasLen: false,
                            hasXuong: false
                        });
                    }
                    const stopObj = stopsMap.get(item.idStop);
                    if (item.coKhachLen) stopObj.hasLen = true;
                    if (item.coKhachXuong) stopObj.hasXuong = true;
                });

                state = {
                    stops: Array.from(stopsMap.values()).sort((a, b) => a.thuTu - b.thuTu),
                    currentSequence: rawData[0].currentStopSequence || 1,
                    huong: rawData[0].huong === -1 ? -1 : 1
                };
                render();

            } catch (err) {
                console.error("❌ [Driver] Lỗi tải dữ liệu:", err);
            }
        }

        function nextStop() {
            if (!state) return;
            const { stops, currentSequence, huong } = state;
            const next = tinhTramKeTiep(currentSequence, huong, stops[0].thuTu, stops[stops.length - 1].thuTu);

            // 1) Cập nhật màn hình NGAY LẬP TỨC (không chờ server)
            stops.forEach(s => {
                if (s.thuTu === currentSequence) { s.hasLen = false; s.hasXuong = false; }
            });
            state.currentSequence = next.seq;
            state.huong = next.huong;
            lastActionAt = Date.now();
            render();

            // 2) Gửi lên server ngầm, xếp hàng để giữ đúng thứ tự
            pending++;
            queue = queue
                .then(() => fetch('/api/next-stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idTrip: ID_TRIP })
                }))
                .then(res => res.json())
                .then(result => console.log("Chuyển trạm:", result))
                .catch(err => console.error("❌ Lỗi chuyển trạm:", err))
                .finally(() => {
                    pending--;
                    if (pending === 0) fetchTripData();   // đồng bộ lại với server khi xong hết
                });
        }

        window.onload = () => {
            fetchTripData();
            setInterval(fetchTripData, 3000);
        };
    </script>
</body>
</html>
